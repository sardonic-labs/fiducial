<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- subtle grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="64" x2="1280" y2="64"/><line x1="0" y1="128" x2="1280" y2="128"/><line x1="0" y1="192" x2="1280" y2="192"/><line x1="0" y1="256" x2="1280" y2="256"/><line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="384" x2="1280" y2="384"/><line x1="0" y1="448" x2="1280" y2="448"/><line x1="0" y1="512" x2="1280" y2="512"/><line x1="0" y1="576" x2="1280" y2="576"/>
    <line x1="64" y1="0" x2="64" y2="640"/><line x1="128" y1="0" x2="128" y2="640"/><line x1="192" y1="0" x2="192" y2="640"/><line x1="256" y1="0" x2="256" y2="640"/><line x1="320" y1="0" x2="320" y2="640"/><line x1="384" y1="0" x2="384" y2="640"/><line x1="448" y1="0" x2="448" y2="640"/><line x1="512" y1="0" x2="512" y2="640"/><line x1="576" y1="0" x2="576" y2="640"/><line x1="640" y1="0" x2="640" y2="640"/><line x1="704" y1="0" x2="704" y2="640"/><line x1="768" y1="0" x2="768" y2="640"/><line x1="832" y1="0" x2="832" y2="640"/><line x1="896" y1="0" x2="896" y2="640"/><line x1="960" y1="0" x2="960" y2="640"/><line x1="1024" y1="0" x2="1024" y2="640"/><line x1="1088" y1="0" x2="1088" y2="640"/><line x1="1152" y1="0" x2="1152" y2="640"/><line x1="1216" y1="0" x2="1216" y2="640"/>
  </g>
  <!-- fiducial mark (top-left) -->
  <g transform="translate(88,88)" opacity="0.9">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#e8e8e8" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#e8e8e8"/>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#e8e8e8" stroke-width="2"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#e8e8e8" stroke-width="2"/>
  </g>
  <!-- title -->
  <text x="88" y="280" font-family="IBM Plex Mono, SF Mono, Menlo, monospace" font-size="112" font-weight="700" fill="#e8e8e8" letter-spacing="-3">fiducial</text>
  <text x="88" y="332" font-family="IBM Plex Mono, SF Mono, Menlo, monospace" font-size="26" fill="#e8e8e8" opacity="0.9">AI agents hallucinate pinouts. fiducial catches them.</text>
  <text x="88" y="372" font-family="IBM Plex Mono, SF Mono, Menlo, monospace" font-size="20" fill="#9a9a9a">lint → erc → check-intent  •  exit codes as agent gates  •  SchematicBuilder</text>
  <!-- pills -->
  <g transform="translate(88,420)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#1a1a1a" stroke="#2a2a2a"/>
    <circle cx="20" cy="18" r="7" fill="#22c55e"/>
    <text x="36" y="24" font-family="IBM Plex Mono, monospace" font-size="15" fill="#e8e8e8">CI  passing</text>
    <rect x="186" y="0" width="110" height="36" rx="18" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="208" y="24" font-family="IBM Plex Mono, monospace" font-size="15" fill="#e8e8e8">KiCad 10</text>
    <rect x="312" y="0" width="140" height="36" rx="18" fill="#1a1a1a" stroke="#2a2a2a"/>
    <text x="334" y="24" font-family="IBM Plex Mono, monospace" font-size="15" fill="#e8e8e8">stdlib only</text>
  </g>
  <!-- terminal snippet (right) -->
  <g transform="translate(760,120)">
    <rect x="0" y="0" width="440" height="280" rx="14" fill="#111111" stroke="#222222"/>
    <circle cx="20" cy="22" r="6" fill="#ff5f56"/><circle cx="40" cy="22" r="6" fill="#ffbd2e"/><circle cx="60" cy="22" r="6" fill="#27c93f"/>
    <text x="16" y="62" font-family="IBM Plex Mono, monospace" font-size="13" fill="#22c55e">$ fiducial lint myboard.kicad_sch</text>
    <text x="16" y="86" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e8e8e8">Lint clean (12 symbols)</text>
    <text x="16" y="112" font-family="IBM Plex Mono, monospace" font-size="13" fill="#22c55e">$ fiducial check-intent … intent.csv</text>
    <text x="16" y="136" font-family="IBM Plex Mono, monospace" font-size="13" fill="#ef4444">*U1  20  /XIN → Net-(U1-XIN)  WRONG</text>
    <text x="16" y="160" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e8e8e8">58/64 verified  •  exit 1</text>
    <text x="16" y="190" font-family="IBM Plex Mono, monospace" font-size="11" fill="#6b7280"># catches what ERC misses</text>
    <text x="16" y="212" font-family="IBM Plex Mono, monospace" font-size="11" fill="#6b7280"># crystal caps floating — board would never boot</text>
  </g>
  <text x="88" y="590" font-family="IBM Plex Mono, monospace" font-size="13" fill="#6b7280">sardonic-labs/fiducial  •  github.com/sardonic-labs/fiducial</text>
</svg>
