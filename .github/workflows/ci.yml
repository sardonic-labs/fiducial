name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel previous runs on same branch (saves minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt archives (KiCad 10)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-kicad-10-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-kicad-10-
            ${{ runner.os }}-apt-

      - name: Install KiCad 10
        run: |
          # Cache hit still needs ppa + update, but archives are cached (~70s → ~15s)
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --install-recommends kicad

      - name: Environment check
        run: |
          kicad-cli version
          python3 --version
          python3 scripts/fiducial.py doctor

      - name: Run tests (offline + kicad)
        run: python3 -m unittest discover -s tests -v

      - name: Docs check
        run: python3 scripts/docs_check.py
